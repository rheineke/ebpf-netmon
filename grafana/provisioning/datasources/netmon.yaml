apiVersion: 1
datasources:
  - name: ClickHouse
    uid: netmon-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: 127.0.0.1
      port: 9000
      protocol: native
      username: grafana
      defaultDatabase: netmon
      # The plugin asks for this plus 5 s, which clickhouse/users.d/grafana.xml
      # allows up to 65.
      queryTimeout: "60"
