# Python dependencies for tools/ and tests/. Not a package: uv only manages
# the environment, from uv.lock.
#   uv run tests/iceberg_test.py
[project]
name = "ebpf-netmon"
version = "0"
requires-python = ">=3.13"
dependencies = [
    # Day partitioning needs pyiceberg-core; sql-postgres is for --catalog.
    "pyiceberg[pyarrow,sql-sqlite,sql-postgres,pyiceberg-core]==0.12.0",
]

[tool.uv]
package = false
required-version = ">=0.13.5"

[dependency-groups]
dev = [
    "pyyaml>=6",
]
