name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, for newly added queries

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    # Debian trixie, like the Pis, for bpftool and a recent libbpf.
    container: debian:trixie
    steps:
      # CodeQL needs git and python3 for every language.
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git \
            python3 bpftool clang g++ libbpf-dev libelf-dev linux-libc-dev \
            llvm make zlib1g-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build
        if: matrix.build-mode == 'manual'
        run: make all
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{ matrix.language }}
