name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # arm64, like the Pis. The runner kernel allows kprobes in privileged containers.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
          persist-credentials: false
      # Formatters and linters from .pre-commit-config.yaml; fails on any change.
      - name: pre-commit
        run: |
          pipx run pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks (all commits)
        run: >
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose /repo
      - name: clang-tidy
        run: docker build --target lint .
      - name: ASan and UBSan
        run: |
          docker build --target sanitize -t ebpf-netmon:sanitize .
          docker run --rm --privileged ebpf-netmon:sanitize
      - name: Build
        run: docker build --target test -t ebpf-netmon:test .
      - name: Smoke test
        run: docker run --rm --privileged ebpf-netmon:test
      # The same script a Pi runs, as a non-root user with sudo, so PATH
      # matches a normal Pi login.
      - name: Build script
        run: |
          docker run --rm --privileged -v "$PWD":/repo debian:trixie sh -c '
            apt-get update -qq && apt-get install -y -qq sudo >/dev/null &&
            useradd -m pi && echo "pi ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/pi &&
            cp -r /repo /home/pi/ebpf-netmon && chown -R pi /home/pi/ebpf-netmon &&
            su pi -c "cd ~/ebpf-netmon && scripts/build_on_pi.sh"'
