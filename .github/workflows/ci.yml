name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # arm64, like the Pis. The runner kernel allows kprobes in privileged containers.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
          persist-credentials: false
      # Formatters and linters from .pre-commit-config.yaml; fails on any change.
      - name: pre-commit
        run: |
          pipx run pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks (all commits)
        run: >
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose /repo
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.13.5
          enable-cache: false
      - name: Iceberg converter test
        run: uv run --locked tests/iceberg_test.py
      - name: Iceberg converter test, PostgreSQL catalog
        run: |
          scripts/install_postgres.sh "$(id -un)"
          NETMON_TEST_CATALOG='postgresql+psycopg2://netmon@/netmon?host=/var/run/postgresql' \
            uv run --locked tests/iceberg_test.py
      # Installs the release ClickHouse (the runner is ARMv8.2) on the runner.
      - name: Dashboard queries
        run: |
          uv sync --locked
          sudo .venv/bin/python tests/dashboard_test.py load /var/lib/netmon-test
          scripts/install_clickhouse.sh /var/lib/netmon-test/warehouse \
            /var/lib/netmon-test/raw
          .venv/bin/python tests/dashboard_test.py check /var/lib/netmon-test
          sudo .venv/bin/python tests/dashboard_test.py convert /var/lib/netmon-test
          .venv/bin/python tests/dashboard_test.py check /var/lib/netmon-test
          sudo .venv/bin/python tests/dashboard_test.py maintain /var/lib/netmon-test
          .venv/bin/python tests/dashboard_test.py check /var/lib/netmon-test
      - name: Dashboard queries, REST catalog
        env:
          NETMON_TEST_CATALOG: postgresql+psycopg2://netmon@/netmon?host=/var/run/postgresql
        run: |
          scripts/install_postgres.sh root  # the converter's user
          test=/var/lib/netmon-rest
          as_root() {
            sudo --preserve-env=NETMON_TEST_CATALOG .venv/bin/python \
              tests/dashboard_test.py "$1" $test
          }
          as_root load
          scripts/install_rest_catalog.sh $test/warehouse
          scripts/install_clickhouse.sh $test/warehouse $test/raw
          .venv/bin/python tests/dashboard_test.py check $test
          # The next step loads the last hour, as netmon.
          as_root maintain
          .venv/bin/python tests/dashboard_test.py check $test
      # The installer and units as a Pi runs them, on the REST step's
      # warehouse and catalog, which root wrote: the handover, then a load
      # (the last hour) and maintenance as netmon.
      - name: Converter as netmon
        env:
          NETMON_TEST_CATALOG: postgresql+psycopg2://netmon@/netmon?host=/var/run/postgresql
          NETMON_UID: 4321  # as tests/sync_test.sh gives it
        run: |
          test=/var/lib/netmon-rest
          fail() { echo "FAIL: $*" >&2; exit 1; }
          # The runner's Python is too old, and the units hide /home.
          sudo env UV_PYTHON_INSTALL_DIR=/opt/python "$(command -v uv)" python install 3.13
          python=$(ls /opt/python/cpython-3.13*/bin/python3.13 | head -1)
          scripts/install_postgres.sh  # netmon, instead of root
          sudo mkdir -p /var/lib/netmon
          echo '{}' | sudo tee /var/lib/netmon/iceberg-run.json >/dev/null  # an old marker
          NETMON_PYTHON=$python scripts/install_converter.sh $test/warehouse $test/raw \
            "$NETMON_TEST_CATALOG"
          sudo test ! -e /var/lib/netmon/iceberg-run.json || fail "old marker left"
          [ "$(systemctl show -p User --value netmon-iceberg.service)" = netmon ] \
            || fail "the converter doesn't run as netmon"
          # The installer's run, the first; the timer's may follow.
          added=$(sudo journalctl -u netmon-iceberg.service -o cat \
            | sed -n '/^added /{s/^added \([0-9]*\) rows.*/\1/p;q;}')
          [ "${added:-0}" -gt 0 ] || fail "the netmon run loaded nothing"
          echo $(($(cat $test/iceberg_rows) + added)) | sudo tee $test/iceberg_rows
          .venv/bin/python tests/dashboard_test.py check $test
          sudo systemctl start netmon-iceberg-maintain.service
          .venv/bin/python tests/dashboard_test.py check $test
          [ -z "$(sudo find $test/warehouse ! -user netmon)" ] \
            || fail "files in the warehouse not owned by netmon"
          out=$(sudo psql -U netmon -d netmon -c 'SELECT 1' 2>&1 || true)
          case $out in
            *"Peer authentication failed"*) ;;
            *) fail "root can still log in to the catalog: $out" ;;
          esac
          # Last, as the converter refuses a newer stray metadata file.
          sudo .venv/bin/python tests/dashboard_test.py stray $test
          .venv/bin/python tests/dashboard_test.py check $test
      - name: Sync
        run: tests/sync_test.sh
      - name: clang-tidy
        run: docker build --target lint .
      - name: ASan and UBSan
        run: |
          docker build --target sanitize -t ebpf-netmon:sanitize .
          docker run --rm --privileged ebpf-netmon:sanitize
      - name: Build
        run: docker build --target test -t ebpf-netmon:test .
      - name: Smoke test
        run: docker run --rm --privileged ebpf-netmon:test
      # A loopback NFS export on the runner. --pid=host because netmon
      # reports host pids, and the test looks for its own.
      - name: NFS test
        run: |
          sudo apt-get install -y -qq nfs-kernel-server
          sudo mkdir -p /srv/nfstest /mnt/nfstest
          echo "/srv/nfstest 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)" \
            | sudo tee -a /etc/exports
          sudo exportfs -ra
          sudo mount -t nfs4 127.0.0.1:/srv/nfstest /mnt/nfstest
          head -c 30000000 /dev/urandom | sudo tee /srv/nfstest/sample.bin >/dev/null
          docker run --rm --privileged --pid=host -v /mnt/nfstest:/mnt/nfstest \
            --entrypoint python3 ebpf-netmon:test \
            tests/nfs_test.py /mnt/nfstest/sample.bin /mnt/nfstest
      # The same script a Pi runs, as a non-root user with sudo, so PATH
      # matches a normal Pi login.
      - name: Build script
        run: |
          docker run --rm --privileged -v "$PWD":/repo debian:trixie sh -c '
            apt-get update -qq && apt-get install -y -qq sudo >/dev/null &&
            useradd -m pi && echo "pi ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/pi &&
            cp -r /repo /home/pi/ebpf-netmon && chown -R pi /home/pi/ebpf-netmon &&
            su pi -c "cd ~/ebpf-netmon && scripts/build_on_pi.sh"'
